apiVersion: v1
kind: Service
metadata:
  name: todo-list
  namespace: todo
  labels:
    app: todo-list
spec:
  type: NodePort
  selector:
    app: todo-list
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      # 30080 ja e usada pelo bin2dec-svc-nodeport (namespace default).
      nodePort: 30090
